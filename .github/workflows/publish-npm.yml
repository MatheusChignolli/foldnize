name: Publish foldnize to npm

on:
  # Publish once when a GitHub Release is published (not on tag push alone)
  release:
    types: [published]

  # Run manually from GitHub → Actions → "Publish foldnize to npm"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: library

jobs:
  publish:
    name: Publish to npm
    # Library only — skip app releases (foldnize-app-v*)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'release' &&
        startsWith(github.event.release.tag_name, 'foldnize-v') &&
        !startsWith(github.event.release.tag_name, 'foldnize-app-v')
      )
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify trusted publishing support
        run: |
          NPM_VERSION=$(npm --version)
          node -e "const version=process.argv[1]; const [major,minor,patch]=version.split(/[.-]/).map(Number); const supported=major>11 || (major===11 && (minor>5 || (minor===5 && patch>=1))); if (!supported) { console.error('Trusted publishing requires npm 11.5.1 or newer. Found npm '+version); process.exit(1); }" "$NPM_VERSION"
          echo "Using npm $NPM_VERSION with OIDC trusted publishing"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PREFIX="foldnize-v"
          case "$TAG" in
            ${PREFIX}*) ;;
            *)
              echo "Release tag must be ${PREFIX}* (got: $TAG)"
              exit 1
              ;;
          esac
          VERSION="${TAG#${PREFIX}}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Release tag $TAG does not match library/package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing foldnize@$PKG_VERSION"

      - name: Publish to npm
        run: npm publish --access public
